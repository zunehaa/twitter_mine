[project]
name = "twitter-mine"
version = "0.1.0"
description = "Sentix AI Twitter Sentiment Analysis Web Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "gunicorn>=21.2.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
